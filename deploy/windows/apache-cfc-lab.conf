# Frontend CFC Lab trên Apache của Laragon (Windows server).
# 1. Sửa CFC_DIST cho đúng thư mục dự án (dùng dấu /).
# 2. Chép file này vào  C:\laragon\etc\apache2\sites-enabled\00-cfc-lab.conf
# 3. Bật các module trong httpd.conf (Laragon > Apache > httpd.conf), bỏ dấu # ở đầu dòng:
#      LoadModule proxy_module modules/mod_proxy.so
#      LoadModule proxy_http_module modules/mod_proxy_http.so
#      LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so
#      LoadModule rewrite_module modules/mod_rewrite.so
#      LoadModule headers_module modules/mod_headers.so
# 4. Laragon > Reload Apache.  Mở: http://<IP-server>:5173  ·  Tra cứu: http://<IP-server>:5173/tracuu/

Define CFC_DIST "C:/cfc-lab/source/fe/dist"

Listen 5173
<VirtualHost *:5173>
    DocumentRoot "${CFC_DIST}"
    <Directory "${CFC_DIST}">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # API và thông báo thời gian thực chuyển sang backend Java (cổng 8080 trên cùng máy).
    ProxyPreserveHost On
    ProxyTimeout 180
    ProxyPass        /ws/  ws://127.0.0.1:8080/ws/
    ProxyPassReverse /ws/  ws://127.0.0.1:8080/ws/
    ProxyPass        /api/ http://127.0.0.1:8080/api/
    ProxyPassReverse /api/ http://127.0.0.1:8080/api/

    RewriteEngine On
    RewriteRule ^/tracuu$ /tracuu/ [R=301,L,QSA]
    # Ứng dụng React: đường dẫn không phải file thật thì trả index.html.
    RewriteCond %{REQUEST_URI} !^/(api|ws|tracuu)/
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-d
    RewriteRule ^ /index.html [L]

    <Location "/tracuu/">
        Header always set Referrer-Policy "no-referrer"
    </Location>
    <Files "index.html">
        Header set Cache-Control "no-cache"
    </Files>
    <Files "service-worker.js">
        Header set Cache-Control "no-cache"
    </Files>
</VirtualHost>
