# Frontend + chuyển tiếp API/WebSocket sang backend ở cùng máy (cổng 8080).
server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 110m;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    # Trang tra cứu công khai cho khách (mã QR trên phiếu trỏ tới đây).
    location = /tracuu { return 301 /tracuu/$is_args$args; }
    location /tracuu/ {
        try_files $uri $uri/ /tracuu/index.html;
        add_header Referrer-Policy "no-referrer" always;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /service-worker.js { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }

    # Ứng dụng React: mọi đường dẫn khác trả về index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
