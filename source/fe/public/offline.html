<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f3f8f4">
    <meta name="robots" content="noindex">
    <title>Chưa có kết nối | CFC Lab</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #f3f8f4; color: #123d2a; font: 1rem/1.55 system-ui, sans-serif; padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); }
      main { width: min(100%, 420px); padding: clamp(20px, 6vw, 34px); border: 1px solid #d5e3d9; border-radius: 14px; background: #fff; }
      strong { color: #38674f; }
      h1 { margin: .5rem 0 0; font-size: 1.65rem; line-height: 1.2; }
      a { display: inline-grid; min-height: 44px; place-items: center; padding: 0 16px; background: #38674f; color: #fff; border-radius: 9px; text-decoration: none; font-weight: 700; touch-action: manipulation; }
      a:focus-visible { outline: 3px solid #c58225; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <strong>CFC Lab</strong>
      <h1>Chưa có kết nối</h1>
      <p>Kết nối lại Wi-Fi hoặc dữ liệu di động để mở hồ sơ và tiếp tục làm việc.</p>
      <a href="">Thử lại</a>
    </main>
  </body>
</html>
