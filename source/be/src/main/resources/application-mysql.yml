spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/cfc_lab?useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:cfc}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: 2s
      repositories:
        enabled: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Existing cfc_lab databases do not have Flyway history yet. Baseline them
    # at the current schema, while an empty database executes V1 normally.
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: existing-schema
    clean-disabled: true
  jpa:
    hibernate:
      # Flyway owns schema changes; Hibernate only checks entity/schema alignment.
      ddl-auto: validate
