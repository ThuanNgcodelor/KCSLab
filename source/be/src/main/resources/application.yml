spring:
  application:
    name: cfc-lab-management-backend
  profiles:
    default: mysql
  jpa:
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 105MB

app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  security:
    issuer: ${JWT_ISSUER:cfc-lab-management}
    jwt-secret: ${JWT_SECRET:dev-only-change-this-secret-to-at-least-32-bytes}
    access-token-seconds: ${ACCESS_TOKEN_SECONDS:900}
    secure-cookie: ${SECURE_COOKIE:false}
    cookie-path: /
  seed-admin:
    email: ${ADMIN_EMAIL:admin@example.com}
    password: ${ADMIN_PASSWORD:}
  storage:
    avatar-root: ${AVATAR_STORAGE_ROOT:storage/avatars}

  # Customer messages are opt-in per receipt. Live sending requires a separate explicit gate.
  customer-notifications:
    mode: ${CUSTOMER_NOTIFICATION_MODE:OFF}
    worker-enabled: ${CUSTOMER_NOTIFICATION_WORKER_ENABLED:true}
    allowed-phones: ${CUSTOMER_NOTIFICATION_ALLOWED_PHONES:}
    app-id: ${ZALO_APP_ID:}
    oa-id: ${ZALO_OA_ID:}
    template-id: ${ZALO_INTAKE_TEMPLATE_ID:}
    template-version: ${ZALO_INTAKE_TEMPLATE_VERSION:1}
    bindings-json: ${ZALO_INTAKE_BINDINGS_JSON:{}}
    access-token: ${ZALO_ACCESS_TOKEN:}
    session-key: ${CUSTOMER_NOTIFICATION_TEST_SESSION:}
    max-calls-per-session: ${CUSTOMER_NOTIFICATION_MAX_TEST_CALLS:5}
    webhook-enabled: ${ZALO_WEBHOOK_ENABLED:false}
    webhook-secret: ${ZALO_WEBHOOK_SECRET:}
    webhook-max-age-seconds: ${ZALO_WEBHOOK_MAX_AGE_SECONDS:86400}
    polling-enabled: ${ZALO_STATUS_POLLING_ENABLED:false}
    max-status-checks: ${ZALO_MAX_STATUS_CHECKS:6}
    token-refresh-enabled: ${ZALO_TOKEN_REFRESH_ENABLED:false}
    token-encryption-key: ${ZALO_TOKEN_ENCRYPTION_KEY:}
    app-secret: ${ZALO_APP_SECRET:}
    live-enabled: ${CUSTOMER_NOTIFICATION_LIVE_ENABLED:false}
    live-allow-all-recipients: ${CUSTOMER_NOTIFICATION_LIVE_ALLOW_ALL_RECIPIENTS:false}

  # KQKN-DV report. Signatory names are defaults taken from the LAB's sample template and can be edited per dossier;
  # LAB must confirm who signs. lookup-url is the public page printed in the QR code of every newly published PDF
  # (QR = lookup-url + ?code=...). Default = LAN address of the Vite dev server; set PUBLIC_LOOKUP_URL to the real
  # domain later (e.g. https://tracuu.example.vn/tracuu/). Set it to an empty value to print the code as text only.
  report:
    quality-head-name: ${REPORT_QUALITY_HEAD_NAME:Phan Trường Tiền}
    director-name: ${REPORT_DIRECTOR_NAME:Nguyễn Công Huân}
    # DOCX -> PDF needs LibreOffice on the server (apt install libreoffice-writer-nogui fonts-liberation fonts-crosextra-carlito).
    office-command: ${REPORT_OFFICE_COMMAND:soffice}
    office-timeout-seconds: ${REPORT_OFFICE_TIMEOUT_SECONDS:90}
  public:
    lookup-url: ${PUBLIC_LOOKUP_URL:http://192.168.1.132:5173/tracuu/}
    client-ip-header: ${PUBLIC_CLIENT_IP_HEADER:}

server:
  port: ${PORT:8080}
